services:
  searxng:
    image: ghcr.io/searxng/searxng:latest
    container_name: jpllama-searxng
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      SEARXNG_HOST: 0.0.0.0
      SEARXNG_PORT: 8080
      SEARXNG_BASE_URL: http://127.0.0.1:8081/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-me-in-production}
      SEARXNG_VALKEY_URL: valkey://valkey:6379/0
      SEARXNG_DEBUG: "0"
    volumes:
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./config/searxng/limiter.toml:/etc/searxng/limiter.toml:ro
    depends_on:
      valkey:
        condition: service_started
    networks:
      - jpllama-web

  valkey:
    image: valkey/valkey:8-alpine
    container_name: jpllama-searxng-valkey
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    volumes:
      - searxng-valkey:/data
    networks:
      - jpllama-web

volumes:
  searxng-valkey:

networks:
  jpllama-web:
    driver: bridge